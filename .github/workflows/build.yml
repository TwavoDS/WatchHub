name: Build WatchHub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build phone app (APK)
        id: apk
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee apk-build.log

      - name: Build watch app (RPK)
        id: rpk
        continue-on-error: true
        run: |
          set -o pipefail
          cd watch
          npm install --no-audit --no-fund 2>&1 | tail -5
          npx aiot release 2>&1 | tee ../rpk-build.log

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/WatchHub-phone.apk || true
          find . -path ./node_modules -prune -o -name 'com.twavods.watchhub*.rpk' -print | head -1 | xargs -r -I{} cp {} out/WatchHub-watch.rpk
          PV=$(grep -oP 'versionCode = \K[0-9]+' android/app/build.gradle.kts)
          PN=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          WV=$(grep -oP '"versionCode": \K[0-9]+' watch/src/manifest.json)
          WN=$(grep -oP '"versionName": "\K[^"]+' watch/src/manifest.json)
          echo "{\"phone\":$PV,\"phoneName\":\"$PN\",\"watch\":$WV,\"watchName\":\"$WN\"}" > out/version.json
          cp android/app/src/main/assets/changelog.txt out/changelog.txt
          cat out/version.json
          ls -la out

      - name: Publish build logs (ci-logs branch)
        if: always()
        run: |
          git config user.name "watchcam-ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/logs && cp *.log /tmp/logs/ 2>/dev/null || true
          cp out/* /tmp/logs/ 2>/dev/null || true
          echo "apk=${{ steps.apk.outcome }} rpk=${{ steps.rpk.outcome }} sha=${{ github.sha }}" > /tmp/logs/STATUS.txt
          git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/logs/* .
          git add -A && git commit -m "CI logs for ${{ github.sha }}" >/dev/null
          git push -f origin ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: WatchHub
          path: out/*

      - name: Release
        if: steps.apk.outcome == 'success' && steps.rpk.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WatchHub (nieuwste versie)
          prerelease: false
          make_latest: true
          files: |
            out/WatchHub-phone.apk
            out/WatchHub-watch.rpk
            out/version.json
